<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Report — Signal / Noise</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body data-page="report">

  <header class="site-header">
    <div class="container header-inner">
      <a class="brand" href="index.html">Signal <span>/</span> Noise</a>
      <button class="nav-toggle" id="navToggle" aria-label="Toggle navigation" aria-expanded="false">
        <span></span><span></span><span></span>
      </button>
      <nav class="site-nav" id="siteNav">
        <a href="research.html" data-nav="research">Research</a>
        <a href="projects.html" data-nav="projects">Projects</a>
      </nav>
    </div>
  </header>

  <main class="container report-page">

    <!-- Loading state: accurately describes what is happening -->
    <div class="report-loading" id="reportLoading" hidden>
      <div class="loading-spinner" aria-hidden="true"></div>
      <p id="loadingMessage">Retrieving public repository data…</p>
    </div>

    <!-- Human-readable error state; never raw API errors -->
    <div class="report-error" id="reportError" hidden>
      <h2 id="errorTitle">Couldn't retrieve repository data</h2>
      <p id="errorMessage"></p>
      <a class="btn btn-primary" href="research.html">Back to research</a>
    </div>

    <!-- Report -->
    <div id="reportMain" hidden>

      <div class="demo-banner" id="demoBanner" hidden>
        Demo research — fictional Northstar dataset. This is not live source data and cannot be saved to your library.
      </div>

      <header class="report-header">
        <div class="report-title-row">
          <div class="report-title-main">
            <h1 id="projectName"></h1>
            <a class="report-url" id="projectUrl" href="#" target="_blank" rel="noopener noreferrer"></a>
          </div>
          <button class="btn btn-secondary" id="saveBtn" type="button">Save research</button>
        </div>
        <p class="report-subline">
          <span class="src-chip" id="sourceTypeChip"></span>
          <span id="reportSubline"></span>
        </p>
        <p class="save-note" id="saveNote" hidden></p>
      </header>

      <section class="meta-section" id="metaSection" hidden>
        <h2>Repository metadata</h2>
        <dl class="repo-meta" id="repoMeta"></dl>
      </section>

      <section class="findings-grid">
        <div class="findings-col">
          <h2>Signal <span class="count" id="signalCount">00</span></h2>
          <div class="findings-list" id="signalList"></div>
        </div>
        <div class="findings-col">
          <h2>Noise <span class="count" id="noiseCount">00</span></h2>
          <div class="findings-list" id="noiseList"></div>
        </div>
        <div class="findings-col">
          <h2>Unknown <span class="count" id="unknownCount">00</span></h2>
          <div class="findings-list" id="unknownList"></div>
        </div>
      </section>

      <section class="sources-section">
        <h2>Sources</h2>
        <div class="source-grid" id="sourceList"></div>
      </section>

    </div>
  </main>

  <script src="sources.js"></script>
  <script src="store.js"></script>
  <script src="app.js"></script>
</body>
</html>
