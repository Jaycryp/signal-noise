<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Projects — Signal / Noise</title>
<meta name="description" content="Your saved Signal / Noise research.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<header>
  <div class="container header-inner">
    <a href="index.html" class="logo">
      SIGNAL <span class="slash">/</span> NOISE
    </a>
    <nav>
      <a href="research.html">Research</a>
      <a href="projects.html" class="active" aria-current="page">Projects</a>
      <a href="index.html#about">About</a>
    </nav>
  </div>
</header>

<main class="container-report">

  <div class="projects-head">
    <h1>Saved research</h1>
    <p class="projects-sub">Reports you've saved live here, on this device only.</p>
  </div>

  <div id="projects-root">
    <p class="report-loading">Loading&hellip;</p>
  </div>

</main>

<footer>
  <div class="container footer-inner">
    <p>Signal / Noise is a research tool for Web3 projects. It checks claims against sources. Nothing here is financial advice.</p>
    <span class="footer-logo">SIGNAL / NOISE</span>
  </div>
</footer>

<div class="confirm-overlay" id="confirmOverlay" hidden>
  <div class="confirm-dialog" role="alertdialog" aria-labelledby="confirmTitle" aria-describedby="confirmDesc">
    <h2 class="confirm-title" id="confirmTitle">Delete this research?</h2>
    <p class="confirm-desc" id="confirmDesc"></p>
    <div class="confirm-actions">
      <button type="button" class="btn btn-ghost btn-compact" id="confirmCancel">Cancel</button>
      <button type="button" class="btn btn-danger btn-compact" id="confirmDelete">Delete</button>
    </div>
  </div>
</div>

<script src="store.js"></script>
<script>
(function () {
  "use strict";

  var root = document.getElementById("projects-root");
  var overlay = document.getElementById("confirmOverlay");
  var confirmDesc = document.getElementById("confirmDesc");
  var confirmCancel = document.getElementById("confirmCancel");
  var confirmDelete = document.getElementById("confirmDelete");
  var pendingDeleteId = null;

  function esc(value) {
    return String(value == null ? "" : value)
      .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;").replace(/'/g, "&#39;");
  }

  function formatDate(iso) {
    if (!iso) return "";
    var d = new Date(iso);
    if (isNaN(d.getTime())) return "";
    return d.toLocaleDateString("en-GB", { day: "2-digit", month: "short", year: "numeric" });
  }

  function countBucket(findings, bucket) {
    var n = 0;
    (findings || []).forEach(function (f) { if (f.bucket === bucket) n++; });
    return n;
  }

  function chip(bucket, label, n) {
    return '<span class="saved-chip">' +
      '<span class="dot dot-' + bucket + '" aria-hidden="true"></span>' +
      label + ' ' + String(n).padStart(2, "0") +
    '</span>';
  }

  function render() {
    var entries = window.SNStore ? SNStore.list() : [];

    if (!entries.length) {
      root.innerHTML =
        '<div class="empty-block">' +
          '<p class="empty-title">No saved research yet</p>' +
          '<p class="empty-desc">Run a research and save it — it will appear here.</p>' +
          '<a class="btn btn-primary btn-compact" href="research.html">Research a project</a>' +
        '</div>';
      return;
    }

    var html = '<ul class="saved-list">';
    entries.forEach(function (e) {
      var s = countBucket(e.findings, "signal");
      var n = countBucket(e.findings, "noise");
      var u = countBucket(e.findings, "unknown");
      html +=
        '<li class="saved-item">' +
          '<div class="saved-main">' +
            '<p class="saved-name">' + esc(e.project) + '</p>' +
            '<p class="saved-id">' + esc(e.url || e.id) + '</p>' +
            '<div class="saved-counts">' +
              chip("signal", "Signal", s) +
              chip("noise", "Noise", n) +
              chip("unknown", "Unknown", u) +
            '</div>' +
            '<p class="saved-date">Saved ' + esc(formatDate(e.savedAt) || "unknown") + '</p>' +
          '</div>' +
          '<div class="saved-actions">' +
            '<a class="btn btn-secondary btn-compact" href="report.html?id=' + encodeURIComponent(e.id) + '">Open</a>' +
            '<button type="button" class="btn btn-ghost btn-compact" data-delete="' + esc(e.id) + '" data-name="' + esc(e.project) + '">Delete</button>' +
          '</div>' +
        '</li>';
    });
    html += '</ul>';

    root.innerHTML = html;

    root.querySelectorAll("[data-delete]").forEach(function (btn) {
      btn.addEventListener("click", function () {
        pendingDeleteId = btn.getAttribute("data-delete");
        confirmDesc.textContent = btn.getAttribute("data-name") + " will be removed from this device. This cannot be undone.";
        overlay.hidden = false;
        confirmDelete.focus();
      });
    });
  }

  confirmCancel.addEventListener("click", function () {
    pendingDeleteId = null;
    overlay.hidden = true;
  });

  overlay.addEventListener("click", function (e) {
    if (e.target === overlay) {
      pendingDeleteId = null;
      overlay.hidden = true;
    }
  });

  confirmDelete.addEventListener("click", function () {
    if (pendingDeleteId && window.SNStore) {
      SNStore.remove(pendingDeleteId);
    }
    pendingDeleteId = null;
    overlay.hidden = true;
    render();
  });

  document.addEventListener("keydown", function (e) {
    if (e.key === "Escape" && !overlay.hidden) {
      pendingDeleteId = null;
      overlay.hidden = true;
    }
  });

  render();
})();
</script>

</body>
</html>
