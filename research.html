<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Research — Signal / Noise</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body data-page="research">

  <header class="site-header">
    <div class="container header-inner">
      <a class="brand" href="index.html">Signal <span>/</span> Noise</a>
      <button class="nav-toggle" id="navToggle" aria-label="Toggle navigation" aria-expanded="false">
        <span></span><span></span><span></span>
      </button>
      <nav class="site-nav" id="siteNav">
        <a href="research.html" data-nav="research">Research</a>
        <a href="projects.html" data-nav="projects">Projects</a>
      </nav>
    </div>
  </header>

  <main class="container research-page">
    <h1>Research a project</h1>
    <p class="lede">Paste a project URL or GitHub repository. Signal / Noise retrieves what public sources can verify — and marks everything else as unknown.</p>

    <form id="researchForm" class="research-form" novalidate>
      <label class="sr-only" for="researchInput">Project URL</label>
      <input
        id="researchInput"
        type="text"
        inputmode="url"
        autocomplete="off"
        spellcheck="false"
        placeholder="https://github.com/owner/repository"
      />
      <p class="input-hint" id="inputHint" hidden></p>
      <p class="input-error" id="inputError" hidden></p>
      <button type="submit" class="btn btn-primary">Research</button>
    </form>

    <p class="demo-link-line">
      No project in mind? <a href="report.html?demo=1">View the demo report</a>.
    </p>
  </main>

  <script src="sources.js"></script>
  <script src="store.js"></script>
  <script src="app.js"></script>
</body>
</html>
